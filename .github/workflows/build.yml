name: Build and offline font QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build from UFO
        run: python scripts/build.py
      - name: Validate retained designs and shaping
        run: python scripts/validate.py
      - name: Install Fontspector
        uses: fonttools/setup-fontspector@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '1.7.4'
      - name: Full Google Fonts profile, offline
        run: python scripts/run_qa.py --fontspector fontspector
      - name: Preserve fonts and complete QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuqu-fonts-and-offline-qa
          path: |
            fonts/
            documentation/qa/
